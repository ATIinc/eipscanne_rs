[package]
name = "scanner"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The scanner side built on eipscanne_rs: sessions, explicit requests and class 3 connections, class 1 I/O connections (also from an EDS file), and the examples"

[dependencies]
eipscanne_rs = { path = ".." }
eds_parser = { path = "../eds_parser", optional = true }
bilge = "0.5.0"
binrw = "0.15.2"
tokio = { version = "1.53.2", features = ["net", "io-util", "time"] }

[features]
default = ["eds"]
# `implicit::eds`: Forward_Open from an EDS file
eds = ["dep:eds_parser"]

[dev-dependencies]
# Used by the examples only
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.9"
hex-assert = { version = "0.2.0", path = "../hex_assert" }
pretty_assertions = "1.4.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }

[[example]]
name = "io-hub-eds-implicit"
required-features = ["eds"]

[[example]]
name = "opener-eds-implicit"
required-features = ["eds"]

[[test]]
name = "eds_forward_open"
required-features = ["eds"]
