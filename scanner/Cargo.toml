[package]
name = "scanner"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The scanner side built on eipscanne_rs: sessions, explicit requests and class 3 connections, class 1 I/O connections (also from an EDS file), and the examples"

[dependencies]
eipscanne_rs = { path = ".." }
# Only `implicit::eds` uses it; worth a feature gate if the scanner is ever wanted without it, for
# explicit messaging alone
eds_parser = { path = "../eds_parser" }
bilge = "0.5.0"
binrw = "0.15.2"
tokio = { version = "1.53.2", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
# Used by the examples only
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.9"
hex-assert = { version = "0.2.0", path = "../hex_assert" }
pretty_assertions = "1.4.1"
