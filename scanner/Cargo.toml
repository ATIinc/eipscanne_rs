[package]
name = "scanner"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
# Every example is listed below; `examples/clearlink_assemblies.rs` and `examples/io_hub_assemblies.rs`
# are shared modules, not examples
autoexamples = false
description = "The scanner side built on eipscanne_rs: sessions, explicit requests, class 1 I/O connections, and the examples"

[dependencies]
eipscanne_rs = { path = ".." }
bilge = "0.5.0"
binrw = "0.15.2"
tokio = { version = "1.53.2", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
# Used by the examples only
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.9"
hex-test-macros = { version = "0.1.0", path = "../hex_test_macros" }
pretty_assertions = "1.4.1"

[[example]]
name = "read-identity"

[[example]]
name = "write-teknic-io"
path = "examples/write-teknic-io/main.rs"
# Carries the byte-exact tests of the ClearLink assemblies, so they run with `cargo test`
test = true

[[example]]
name = "implicit-io"
path = "examples/implicit-io/main.rs"

[[example]]
name = "write-nitra-io"
path = "examples/write-nitra-io/main.rs"

[[example]]
name = "clearlink-homing"
path = "examples/clearlink-homing/main.rs"

[[example]]
name = "io-hub-homing"
path = "examples/io-hub-homing/main.rs"
# Carries the layout tests of the IO-HUB assemblies, so they run with `cargo test`
test = true
