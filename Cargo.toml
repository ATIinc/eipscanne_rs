[workspace]
members = ["hex_test_macros", "eipscanne_utils"]

[package]
name = "eipscanne_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bilge = "0.5.0"
binrw = "0.15.2"
hex-test-macros = { version = "0.1.0", path = "hex_test_macros" }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
default = []            # Comment to enable adapter support
# default = ["adapter"]   # UN-Comment to enable adapter support
# Adapter-side helpers, e.g. reading the requests a scanner sends (`EnIpPacket::read_request`)
adapter = []
