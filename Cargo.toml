[workspace]
members = ["hex_test_macros", "scanner", "eds_parser"]
# `cargo run --example`, `cargo test` and friends cover the library and the scanner without `-p`
default-members = [".", "scanner", "eds_parser"]

[package]
name = "eipscanne_rs"
version = "0.3.0"
edition = "2024"

[dependencies]
bilge = "0.5.0"
binrw = "0.15.2"
hex-test-macros = { version = "0.1.0", path = "hex_test_macros" }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
default = []            # Comment to enable async support
# default = ["async"]   # UN-Comment to enable async support for testing
async = []
